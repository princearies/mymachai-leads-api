name = "mymachai-leads-api"
main = "index.js"
compatibility_date = "2026-10-07"

# Balance: fungsi tetap berbeza, RAM rendah, berjalan dalam 100ms
min_workers = 1
max_workers = 10

# Rate limiting (free tier only, 1 req / 5s per IP)
[vars]
# RATE_LIMIT = "1 req / 5s per IP" — free tier safe

# Optional: Bind env var untuk API key (Ganti dengan .env later)
# GEMINI_API_KEY=***
